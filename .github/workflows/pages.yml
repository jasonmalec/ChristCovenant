# Deploys the Resurgens site to GitHub Pages automatically.
#
# ONE-TIME SETUP (repo owner, ~20 seconds — required once):
#   Repo -> Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# GitHub's automation token isn't allowed to turn Pages on for the first time,
# so this single toggle has to be done by a human. After that, every push to
# `main` republishes the site automatically and the link stays current.
# (enablement: true below makes the workflow finish the setup the moment Pages
#  is switched on, and is harmless before then.)
#
# The site stays noindex + robots Disallow, so publishing here does NOT make it
# searchable — it only produces a shareable link for leaders (Phase 0).

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Source: GitHub Actions) so no manual toggle is needed.
          enablement: true
      - name: Upload site (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
