# Deploys the Resurgens site to GitHub Pages automatically.
#
# This workflow auto-enables GitHub Pages (enablement: true below), so no manual
# setup is needed for a user-owned repo. Every push to `main` republishes the
# site and the Pages link stays current. You can also run it from the Actions tab.
# (If your org restricts Pages, an admin may need to allow it once.)
#
# The site stays noindex + robots Disallow, so publishing here does NOT make it
# searchable — it only produces a shareable link for leaders (Phase 0).

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Source: GitHub Actions) so no manual toggle is needed.
          enablement: true
      - name: Upload site (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
